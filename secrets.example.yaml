# Copy this file to secrets.yaml, replace every placeholder, and never commit it.

wifi_ssid: "YOUR_WIFI_SSID"
wifi_password: "YOUR_WIFI_PASSWORD"

# Generate with: openssl rand -base64 32
api_encryption_key: "YOUR_32_BYTE_BASE64_API_KEY"
ota_password: "YOUR_OTA_PASSWORD"
fallback_ap_password: "YOUR_FALLBACK_AP_PASSWORD"

web_username: "YOUR_WEB_USERNAME"
web_password: "YOUR_WEB_PASSWORD"

# Example: http://192.0.2.10:8080/api/v1/upload/exp/
urad_mock_url: "http://YOUR_MOCK_SERVER_IP:8080/api/v1/upload/exp/"

# Obtain these from the API tab in your uRADMonitor account.
urad_user_id: "YOUR_URADMONITOR_USER_ID"
urad_user_hash: "YOUR_URADMONITOR_USER_HASH"
