services:
  urad-mock:
    build: .
    container_name: urad-mock
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      MOCK_LOG_FILE: /data/urad_mock.ndjson
      MOCK_USER_ID: test
      MOCK_USER_HASH: test
      MOCK_DEVICE_ID: 13ABC001
      MOCK_DELAY_MS: 0
      MOCK_FAIL_EVERY_N: 0
    volumes:
      - ./data:/data
